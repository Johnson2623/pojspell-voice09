<body><main class="app" id="app" data-page="build">
<nav class="page-switch" id="pageSwitch" role="tablist" aria-label="切換學習分頁">
<button id="tab-build" role="tab" data-page-choice="build" aria-selected="true" aria-controls="builderPanel" disabled>自己拼音初級</button>
<button id="tab-advanced" role="tab" data-page-choice="advanced" aria-selected="false" aria-controls="advancedBuilderPanel" disabled>自己拼音進階</button>
<button id="tab-auto" role="tab" data-page-choice="auto" aria-selected="false" aria-controls="autoBuilderPanel" disabled>自動拼音</button>
<button id="tab-listen" role="tab" data-page-choice="listen" aria-selected="false" aria-controls="player" disabled>聆聽</button>
<button id="tab-examples" role="tab" data-page-choice="examples" aria-selected="false" aria-controls="examplesPanel" disabled>辭庫1999</button>
</nav>
<div id="loadMessage" class="load-message" role="status">正在準備例音…</div>
<div class="workspace">
<section class="panel" id="builderPanel" role="tabpanel" aria-labelledby="tab-build">
<div class="builder">
<label class="onset-field">子音<select id="onset" aria-label="初級子音" disabled></select></label>
<label>母音<select id="final" aria-label="初級母音" disabled></select></label>
<label>音調<select class="tone-select" id="toneSelect" aria-label="初級音調" disabled></select></label>
<label for="combinedSound">呼音<output class="combined-sound" id="combinedSound" for="onset final toneSelect" aria-live="polite"></output></label>
</div><div class="tone-slot"></div><div class="formula-play-row"><div class="formula" id="formula"></div><button class="primary builder-play" id="builderPlay" disabled>選好後按 ▶ 聆聽這個拼音</button></div>
<p class="sub">初級只列單母音與相應韻尾；第 4、8 調請先選含 p、t、k、h 韻尾的母音。</p>
</section>
<section class="panel" id="advancedBuilderPanel" role="tabpanel" aria-labelledby="tab-advanced" hidden>
<div class="builder">
<label class="onset-field">子音<select id="advancedOnset" aria-label="進階子音" disabled></select></label>
<label>母音<select id="advancedFinal" aria-label="進階母音" disabled></select></label>
<label>音調<select class="tone-select" id="advancedToneSelect" aria-label="進階音調" disabled></select></label>
<label for="advancedCombinedSound">呼音<output class="combined-sound" id="advancedCombinedSound" for="advancedOnset advancedFinal advancedToneSelect" aria-live="polite"></output></label>
</div><div class="tone-slot"></div><div class="formula-play-row"><div class="formula" id="advancedFormula"></div><button class="primary builder-play" id="advancedBuilderPlay" disabled>選好後按 ▶ 聆聽這個拼音</button></div>
<p class="sub">加入雙母音、三母音與鼻音。所有可選組合都有對應的真人例音。</p>
</section>
<section class="panel" id="autoBuilderPanel" role="tabpanel" aria-labelledby="tab-auto" hidden>
<div class="builder">
<label class="onset-field">子音<select id="autoOnset" aria-label="自動子音" disabled></select></label>
<label>母音<select id="autoFinal" aria-label="自動母音" disabled></select></label>
<label>音調<select class="tone-select" id="autoToneSelect" aria-label="自動音調" disabled></select></label>
<label for="autoCombinedSound">呼音<output class="combined-sound" id="autoCombinedSound" aria-live="polite"></output></label>
</div><div class="tone-slot auto-tone-row"><label class="speed-field tone-speed"><span class="speed-title">速度</span><select id="autoToneSpeed" aria-label="音調列速度"><option value="3">3秒</option><option value="4">4秒</option><option value="5">5秒</option><option value="7">7秒</option><option value="10">10秒</option></select></label></div>
<div class="player" id="autoListen"></div>
</section>
<section class="panel" id="player" role="tabpanel" aria-labelledby="tab-listen" hidden><div class="tone-slot"></div><div class="player" id="listenHost"></div></section>
<section class="panel examples-panel" id="examplesPanel" role="tabpanel" aria-labelledby="tab-examples" hidden>
<div class="tone-slot"></div>
<div class="practice-tools" id="practiceTools">
<div class="practice-modes" role="group" aria-label="自測顯示方式"><button data-practice-mask="none" aria-pressed="true">全部顯示</button><button data-practice-mask="poj" aria-pressed="false">遮白話字自測</button><button data-practice-mask="han" aria-pressed="false">遮漢字自測</button></div>
<label class="practice-speed">調整速度<select id="practiceSpeed" aria-label="例音換序速度"><option value="3">3秒</option><option value="4">4秒</option><option value="5">5秒</option><option value="7">7秒</option><option value="10">10秒</option></select></label>
<span class="toolbar-sample-count" id="toolbarSampleCount"></span>
</div><div class="samples" id="samples" aria-label="真人例音，點選可聆聽"></div>
</section>
</div>
<nav class="tones" id="tones" aria-label="音調符號"></nav>
<div class="voice-display" id="voiceDisplay" hidden>
<div class="voice-text-columns"><div class="syllable" id="syllable"></div><div class="han" id="han"></div></div>
<div class="listen-controls"><div class="playrow"><button class="primary" id="play">▶ 播放例音</button><button class="secondary" id="stop">■ 停止</button></div><div class="source-row"><a id="sourceLink" target="_blank" rel="noopener">教育部・例音來源 ↗</a></div><div class="status" id="status" role="status" aria-live="polite" hidden>點選播放，聆聽真人例音。</div></div>
</div>

function selectPart(rows, current, kind, value) {
  let candidates = rows.filter(row => row.onset === (kind === 'onset' ? value : current.onset));
  if (kind !== 'onset') candidates = candidates.filter(row => row.final === (kind === 'final' ? value : current.final));
  return candidates.find(row => row.tone === (kind === 'tone' ? Number(value) : current.tone)) || candidates[0] || current;
}
function shuffled(rows, random = Math.random) {
  const result = [...rows];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function nextExample(rows, current, random = Math.random) {
  const candidates = rows.filter(row => row !== current);
  return candidates[Math.floor(random() * candidates.length)] || current;
}
function matchedEnding(row, letter) {
  return [4, 8].includes(row.tone) && row.final.includes(letter);
}

const $ = id => document.getElementById(id);
const panels = {build:'builderPanel', advanced:'advancedBuilderPanel', auto:'autoBuilderPanel', listen:'player', examples:'examplesPanel'};
const audio = $('voiceAudio');
const state = {rows:[], data:{}, current:null, page:'build', ready:false, auto:false, linked:false, autoTimer:null, dictionaryTimer:null, mask:'none', speed:3, dictionarySpeed:3, generation:0};
const escapeHtml = text => String(text).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const option = (value, label = value || '無聲母') => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`;
const isAutoPage = () => state.page === 'auto' || (state.page === 'listen' && state.linked);

function cancelPlayback(message = '已停止') {
  state.generation++;
  audio.onended = null;audio.onerror = null;audio.pause();
  $('status').textContent = message;
}
function stopAuto() {
  clearTimeout(state.autoTimer);state.autoTimer = null;state.auto = false;
  $('play').textContent = '▶ 播放例音';
}
function stopDictionary() {clearInterval(state.dictionaryTimer);state.dictionaryTimer = null;}

function renderBuilder(prefix, rows) {
  const x = state.current;
  const ids = prefix === 'advanced' ? ['advancedOnset','advancedFinal','advancedToneSelect','advancedCombinedSound','advancedFormula']
    : prefix === 'auto' ? ['autoOnset','autoFinal','autoToneSelect','autoCombinedSound',null]
    : ['onset','final','toneSelect','combinedSound','formula'];
  const onsets = unique(rows.map(r => r.onset));
  const finals = unique(rows.filter(r => r.onset === x.onset).map(r => r.final));
  const tones = TONES.filter(t => rows.some(r => r.onset === x.onset && r.final === x.final && r.tone === t));
  $(ids[0]).innerHTML = onsets.map(v => option(v)).join('');
  $(ids[1]).innerHTML = finals.map(v => option(v)).join('');
  $(ids[2]).innerHTML = tones.map(t => option(t, `第 ${t} 調`)).join('');
  $(ids[0]).value = x.onset;$(ids[1]).value = x.final;$(ids[2]).value = String(x.tone);
  $(ids[3]).textContent = x.poj;
  if (ids[4]) $(ids[4]).textContent = `${x.onset || '無聲母'} ＋ ${x.final} ＋ 第 ${x.tone} 調 → ${x.poj}`;
}
function renderTones() {
  const x = state.current, selectable = state.page === 'examples';
  const symbols = {1:'a',2:'á',3:'à',4:'aptkh',5:'â',7:'ā',8:'a̍ptkh'};
  $('tones').innerHTML = TONES.map(t => {
    let symbol = symbols[t];
    if ([4,8].includes(t)) symbol = (t === 4 ? 'a' : 'a̍') + ['p','t','k','h'].map(letter => `<span class="tone-ending-letter${t === x.tone && matchedEnding(x,letter) ? ' is-match' : ''}">${letter}</span>`).join('');
    return `<button class="tone" data-tone="${t}" aria-label="第 ${t} 調 ${symbols[t]}" aria-pressed="${x.tone === t}"${selectable ? '' : ' disabled aria-disabled="true"'}><small>第 ${t} 調</small><b${[4,8].includes(t) ? ' class="tone-endings"' : ''}>${symbol}</b></button>`;
  }).join('');
}
function renderCurrent() {
  if (!state.current) return;
  const x = state.current;
  renderBuilder('build', state.rows.filter(isBeginner));renderBuilder('advanced', state.rows);renderBuilder('auto', state.rows);renderTones();
  $('syllable').textContent = x.poj;$('han').textContent = x.han;
  $('sourceLink').href = x.sourcePage || x.source;
  $('sourceLink').title = '教育部真人例音；辭典音檔採 CC 姓名標示－禁止改作 3.0 臺灣授權';
  $('voiceDisplay').setAttribute('aria-label', `${x.poj} ${x.han} 第${x.tone}調`);
}
function showPage(page) {
  if (!state.ready || !(page in panels)) return;
  const follow = page === 'listen' && isAutoPage() && state.auto;
  stopDictionary();
  if (!follow && page !== 'auto') {stopAuto();cancelPlayback('點選播放，聆聽真人例音。');}
  state.linked = follow;state.page = page;$('app').dataset.page = page;
  for (const [key,id] of Object.entries(panels)) $(id).hidden = key !== page;
  document.querySelectorAll('[data-page-choice]').forEach(b => {
    const selected = b.dataset.pageChoice === page;
    b.setAttribute('aria-selected', String(selected));b.tabIndex = selected ? 0 : -1;
  });
  $(panels[page]).querySelector('.tone-slot').appendChild($('tones'));
  if (page === 'auto' || page === 'listen') {
    $(page === 'auto' ? 'autoListen' : 'listenHost').appendChild($('voiceDisplay'));
    $('voiceDisplay').hidden = false;
  } else $('voiceDisplay').hidden = true;
  if (page === 'build' && !isBeginner(state.current)) {
    const rows = state.rows.filter(isBeginner);
    state.current = rows.find(r => r.onset === state.current.onset && r.tone === state.current.tone) || rows[0];
  }
  renderCurrent();
}

// Call play in the tap handler before any await or network fetch. Keep one
// persistent audio element so mobile Safari can reuse the activation.
function playCurrent() {
  if (!state.ready) return;
  cancelPlayback('準備播放…');
  const generation = state.generation, row = state.current;
  const failed = error => {
    if (generation !== state.generation) return;
    stopAuto();
    $('status').textContent = error?.name === 'NotAllowedError'
      ? '請按「▶ 播放例音」啟用聲音，會接續自動拼音。'
      : '音檔暫時無法播放，請檢查網路後再按播放。';
  };
  audio.onended = () => {
    if (generation === state.generation) $('status').textContent = state.auto ? `播放完成；每 ${state.speed} 秒換下一個。` : '播放完成，可以再聽一次。';
  };
  audio.onerror = () => failed(new Error('audio'));
  audio.src = row.audio;
  try {
    const attempt = audio.play();
    Promise.resolve(attempt).then(() => {
      if (generation === state.generation) $('status').textContent = `正在播放 ${row.poj}（${row.han}）`;
    }).catch(failed);
  } catch (error) {failed(error);}
}
function scheduleAuto() {
  clearTimeout(state.autoTimer);
  if (!state.auto) return;
  state.autoTimer = setTimeout(() => {
    if (!state.auto || !isAutoPage()) return;
    state.current = nextExample(state.rows, state.current);renderCurrent();playCurrent();scheduleAuto();
  }, state.speed * 1000);
}
function startAuto() {
  if (!state.ready || !isAutoPage()) return;
  stopAuto();state.auto = true;state.speed = Number($('autoToneSpeed').value);
  $('play').textContent = '▶ 再聽一次';playCurrent();scheduleAuto();
}
function renderSamples() {
  const tone = state.current.tone, rows = shuffled(state.data[tone]);
  const count = `第 ${tone} 調 ${rows.length}/${state.rows.length.toLocaleString('en-US')} 個`;
  $('toolbarSampleCount').textContent = count;
  $('samples').innerHTML = rows.map(row => {
    const id = state.rows.indexOf(row), maskPoj = state.mask === 'poj', maskHan = state.mask === 'han';
    return `<button class="sample" data-row="${id}" aria-pressed="${row === state.current}" aria-label="${state.mask === 'none' ? `播放 ${escapeHtml(row.poj)} ${escapeHtml(row.han)}` : '點擊揭曉例音'}"><b${maskPoj ? ' class="practice-hidden" aria-hidden="true"' : ''}>${escapeHtml(row.poj)}</b>&nbsp;&nbsp;<small${maskHan ? ' class="practice-hidden" aria-hidden="true"' : ''}>${escapeHtml(row.han)}</small></button>`;
  }).join('');
}
function startDictionary() {
  stopDictionary();
  if (state.page !== 'examples' || document.hidden) return;
  state.dictionaryTimer = setInterval(() => {
    const scroll = $('samples').scrollTop;renderSamples();$('samples').scrollTop = scroll;
  }, state.dictionarySpeed * 1000);
}
function navigate(page) {
  if (page === 'examples') {
    showPage(page);state.current = state.data[1][0];renderCurrent();renderSamples();
    $('samples').scrollTop = 0;startDictionary();
  } else if (page === 'auto') {showPage(page);startAuto();}
  else {
    const from = state.page;showPage(page);
    if (page === 'listen' && ['build','advanced'].includes(from)) playCurrent();
  }
}
$('pageSwitch').addEventListener('click', event => {
  const button = event.target.closest('[data-page-choice]');
  if (button && !button.disabled) navigate(button.dataset.pageChoice);
});
$('pageSwitch').addEventListener('keydown', event => {
  if (!['ArrowRight','ArrowLeft','Home','End'].includes(event.key)) return;
  event.preventDefault();
  const tabs = [...document.querySelectorAll('[data-page-choice]')], i = tabs.indexOf(document.activeElement);
  const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (i + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
  tabs[next].focus();navigate(tabs[next].dataset.pageChoice);
});
for (const [id,kind] of [['onset','onset'],['final','final'],['toneSelect','tone'],['advancedOnset','onset'],['advancedFinal','final'],['advancedToneSelect','tone']]) {
  $(id).addEventListener('change', event => {
    cancelPlayback('已拼好，按聆聽這個拼音。');
    state.current = selectPart(state.page === 'build' ? state.rows.filter(isBeginner) : state.rows, state.current, kind, event.target.value);
    renderCurrent();
  });
}
for (const id of ['builderPlay','advancedBuilderPlay']) $(id).addEventListener('click', () => {showPage('listen');playCurrent();});
$('play').addEventListener('click', () => {if (isAutoPage()) startAuto();else playCurrent();});
$('stop').addEventListener('click', () => {stopAuto();cancelPlayback();});
$('autoToneSpeed').addEventListener('change', event => {
  const seconds = Number(event.target.value);
  if (!SPEEDS.includes(seconds)) return;
  state.speed = seconds;
  if (isAutoPage()) startAuto();
});
$('tones').addEventListener('click', event => {
  const button = event.target.closest('[data-tone]');
  if (!button || button.disabled || state.page !== 'examples') return;
  state.current = state.data[button.dataset.tone][0];renderCurrent();renderSamples();$('samples').scrollTop = 0;startDictionary();
});
$('samples').addEventListener('click', event => {
  const button = event.target.closest('[data-row]');if (!button) return;
  const masked = button.querySelector('.practice-hidden:not(.is-revealed)');
  if (masked) {
    masked.classList.add('is-revealed');masked.removeAttribute('aria-hidden');
    const row = state.rows[Number(button.dataset.row)];button.setAttribute('aria-label', `播放 ${row.poj} ${row.han}`);return;
  }
  state.current = state.rows[Number(button.dataset.row)];showPage('listen');playCurrent();
});
$('practiceTools').addEventListener('click', event => {
  const button = event.target.closest('[data-practice-mask]');if (!button) return;
  state.mask = button.dataset.practiceMask;
  document.querySelectorAll('[data-practice-mask]').forEach(b => b.setAttribute('aria-pressed', String(b === button)));renderSamples();
});
$('practiceSpeed').addEventListener('change', () => {
  const seconds = Number($('practiceSpeed').value);if (!SPEEDS.includes(seconds)) return;
  state.dictionarySpeed = seconds;startDictionary();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {stopDictionary();stopAuto();cancelPlayback('已暫停；回到頁面後按播放繼續。');}
  else if (state.ready && state.page === 'examples') startDictionary();
});
window.addEventListener('pagehide', () => {stopDictionary();stopAuto();cancelPlayback();});
Promise.resolve({ok:true,json:()=>Promise.resolve(JSON.parse(document.getElementById('poj-data').textContent))}).then(response => {
  if (!response.ok) throw new Error('data');return response.json();
}).then(data => {
  state.data = data;state.rows = TONES.flatMap(t => data[t]);
  if (!state.rows.length) throw new Error('empty');
  state.current = state.rows.find(isBeginner);state.ready = true;$('loadMessage').hidden = true;
  document.querySelectorAll('#pageSwitch button,#builderPanel select,#advancedBuilderPanel select,#builderPlay,#advancedBuilderPlay').forEach(el => el.disabled = false);
  showPage('build');
}).catch(() => {
  $('loadMessage').textContent = '例音載入失敗，請檢查網路後重新整理。';
  const retry = document.createElement('button');retry.textContent = '重新載入';
  retry.addEventListener('click', () => location.reload());$('loadMessage').appendChild(retry);
});

</script></body></html>
